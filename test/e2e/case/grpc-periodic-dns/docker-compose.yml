version: "2.1"

services:
  banyandb:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912
    networks:
      e2e:
        ipv4_address: 172.28.0.11

  oap:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: oap
    ports:
      - 12800
    depends_on:
      banyandb:
        condition: service_healthy
    networks:
      e2e:
        ipv4_address: 172.28.0.12

  # oap-backend (+ search suffixes) first resolves to a blackhole for a window
  # starting at the first query, then flips to real oap for mid-lifecycle recovery.
  dns-mock:
    build:
      context: ../../../..
      dockerfile: test/e2e/base/dns-mock/Dockerfile
    networks:
      e2e:
        ipv4_address: 172.28.0.53
    depends_on:
      oap:
        condition: service_healthy

  provider:
    extends:
      file: ../../base/docker-compose.yml
      service: provider
    dns:
      - 172.28.0.53
    environment:
      SW_AGENT_REPORTER_TYPE: grpc
      SW_AGENT_REPORTER_GRPC_BACKEND_SERVICE: oap-backend:11800
      SW_AGENT_REPORTER_GRPC_RESOLVE_DNS_PERIODICALLY: "true"
      SW_AGENT_REPORTER_GRPC_RESOLVE_DNS_PERIOD: "5"
    ports:
      - 8080
    depends_on:
      dns-mock:
        condition: service_started
      oap:
        condition: service_healthy
    networks:
      e2e:
        ipv4_address: 172.28.0.21

  consumer:
    extends:
      file: ../../base/docker-compose.yml
      service: consumer
    dns:
      - 172.28.0.53
    environment:
      SW_AGENT_REPORTER_TYPE: grpc
      PROVIDER_URL: http://provider:8080
      SW_AGENT_REPORTER_GRPC_BACKEND_SERVICE: oap-backend:11800
      SW_AGENT_REPORTER_GRPC_RESOLVE_DNS_PERIODICALLY: "true"
      SW_AGENT_REPORTER_GRPC_RESOLVE_DNS_PERIOD: "5"
    ports:
      - 8080
    depends_on:
      dns-mock:
        condition: service_started
      oap:
        condition: service_healthy
      provider:
        condition: service_healthy
    networks:
      e2e:
        ipv4_address: 172.28.0.22

networks:
  e2e:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
